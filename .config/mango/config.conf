# -----------------------------------------------------
# MangoWC Configuration
# Ported from Hyprland setup
# -----------------------------------------------------

# --- Source Modules ---
source=~/.config/mango/monitors.conf
source=~/.config/mango/env.conf
source=~/.config/mango/binds.conf
source=~/.config/mango/autostart.conf

# =====================================================
# Effects
# =====================================================
blur=0
blur_layer=0
# Blur tuning, from the mango defaults. Inert while blur=0, but kept here so
# flipping blur on gives the tuned result instead of the raw builtin.
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=4
blur_params_noise=0.04
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2
shadows=1
shadow_only_floating=1
# Shadows off layer surfaces (the quickshell bar, OSD, rofi). shadows=1 alone
# would put one under the full-width bar and darken the top of every window.
layer_shadows=0
shadows_size=8
shadows_blur=10
shadows_position_x=0
shadows_position_y=0
shadows_color=0x000000ff

border_radius=2
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# =====================================================
# Animations
# =====================================================
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=fade
layer_animation_type_open=fade
layer_animation_type_close=fade
animation_fade_in=1
animation_fade_out=1
# Curves for the opacity fade itself. Without them animation_fade_in/out are
# the only knobs and mango falls back to its builtin easing.
animation_curve_opacity_fade_in=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
tag_animation_direction=0
zoom_initial_ratio=0.85
zoom_end_ratio=0.95
fade_in_begin_opacity=0.7
fade_out_begin_opacity=0.9
animation_duration_move=150
animation_duration_open=150
animation_duration_tag=120
animation_duration_close=120
animation_duration_focus=100
animation_curve_open=0.22,1.0,0.36,1
animation_curve_move=0.22,1.0,0.36,1
animation_curve_tag=0.16,1.0,0.3,1
animation_curve_close=0.22,1.0,0.36,1
animation_curve_focus=0.22,1.0,0.36,1

# =====================================================
# Appearance (Material Design 3 colors from matugen)
# =====================================================
# MangoWC colors use 0xRRGGBBAA format
border_px=2
gap_inner_horizontal=2
gap_inner_vertical=2
gap_outer_horizontal=4
gap_outer_vertical=4

# Fallback colors (overridden by matugen-colors.conf when available)
root_color=0x1c1015ff
border_color=0x534248ff
focus_color=0xffb0d0ff
urgent_color=0xe53935ff
maximized_screen_color=0x8c0057ff
scratchpad_color=0x653b43ff
global_color=0xf2b7c2ff
overlay_color=0x291c21ff

# Matugen-generated colors (overrides above when file exists)
source=~/.config/mango/matugen-colors.conf

scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9

# =====================================================
# Cursor
# =====================================================
cursor_size=24
cursor_theme=Adwaita
cursor_hide_timeout=0

# =====================================================
# Input
# =====================================================
repeat_rate=40
repeat_delay=300
numlock_on=1
xkb_rules_layout=us

# Mouse
# NB: the option names are prefixed — a bare `accel_profile=` / `accel_speed=`
# is not a key mango knows and gets dropped without a warning.
mouse_natural_scrolling=0
# 1 = flat (no acceleration), 2 = adaptive (libinput numbering)
mouse_accel_profile=1
mouse_accel_speed=0.0

# =====================================================
# Layout
# =====================================================
new_is_master=1
smart_gaps=0
default_master_factor=0.55
default_master_count=1

# Hyprland ran `layout = dwindle`, so start every tag there for the same
# window-splitting feel. SUPER+SHIFT+semicolon cycles through circle_layout.
tag_rule=id:1,layout_name:dwindle
tag_rule=id:2,layout_name:dwindle
tag_rule=id:3,layout_name:dwindle
tag_rule=id:4,layout_name:dwindle
tag_rule=id:5,layout_name:dwindle

# Dwindle behaviour (closest match to the Hyprland defaults)
dwindle_preserve_split=1
dwindle_smart_split=0
dwindle_smart_resize=1

# =====================================================
# Scroller Layout
# =====================================================
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0
# Reserve for the bar when scroller measures the usable area; overspread fills
# leftover width instead of leaving a gap; pointer focus at the edges lets the
# mouse pull the next column in.
scroller_structs=40
scroller_prefer_overspread=1
edge_scroller_pointer_focus=1

# =====================================================
# Overview
# =====================================================
hotarea_size=10
enable_hotarea=1
# removed in mango 0.18: ov_tab_mode=0
overview_gap_inner=5
overview_gap_outer=30

# =====================================================
# Focus & Behavior
# =====================================================
sloppy_focus=1
warp_cursor=1
focus_on_activate=1
focus_cross_monitor=1
exchange_cross_monitor=1
focus_cross_tag=0
drag_tile_to_tile=1
view_current_to_back=1
allow_tearing=0

# =====================================================
# Window Behavior
# =====================================================
enable_floating_snap=1
snap_distance=30
no_border_when_single=0

# --- Size hints: prevent specific apps from leaving gaps in tiled mode ---
window_rule=no_size_hint:1,app_id:firefox
window_rule=no_size_hint:1,app_id:spotify
window_rule=no_size_hint:1,app_id:vesktop
window_rule=no_size_hint:1,app_id:kitty
window_rule=no_size_hint:1,app_id:cursor
window_rule=no_size_hint:1,app_id:Cursor
window_rule=no_size_hint:1,app_id:obsidian
window_rule=no_size_hint:1,app_id:mpv

# --- Ignore maximize requests (let tiling handle it) ---
window_rule=ignore_maximize:1,app_id:.*

# --- Float: system utilities ---
window_rule=is_floating:1,app_id:pavucontrol
window_rule=is_floating:1,app_id:blueman-manager
window_rule=is_floating:1,app_id:nm-connection-editor
window_rule=is_floating:1,app_id:wdisplays
window_rule=is_floating:1,app_id:system-config-printer
window_rule=is_floating:1,app_id:nwg-look
window_rule=is_floating:1,app_id:qt5ct
window_rule=is_floating:1,app_id:qt6ct
window_rule=is_floating:1,app_id:kvantummanager
window_rule=is_floating:1,app_id:xarchiver
window_rule=is_floating:1,app_id:org.gnome.seahorse.Application
window_rule=is_floating:1,app_id:bitwarden

# --- Steam client (the games themselves are handled in gaming.conf) ---
# Anchored, unlike the stock rule: mango matches appid as an unanchored regex,
# so a bare [Ss]team also hits steam_app_1234 and would float every game.
window_rule=is_floating:1,app_id:^[Ss]team$
# ...except the main library window, which is worth tiling.
window_rule=is_floating:0,app_id:^[Ss]team$,title:^Steam$
window_rule=is_floating:1,app_id:^[Ss]team$,title:^Steam Settings$

# --- Float: common dialog titles ---
window_rule=is_floating:1,title:^Open File$
window_rule=is_floating:1,title:^Save As$
window_rule=is_floating:1,title:^File Upload$
window_rule=is_floating:1,title:^Authentication Required$

# --- Screenshot tools ---
window_rule=no_blur:1,app_id:slurp
window_rule=no_animation:1,app_id:slurp

# --- Terminal swallowing (kitty launches GUI app → replaces itself) ---
window_rule=is_term:1,app_id:kitty
window_rule=no_swallow:1,app_id:firefox

# --- Layer rules ---
layer_rule=no_animation:1,no_blur:1,layer_name:selection
layer_rule=animation_type_open:zoom,layer_name:rofi

# =====================================================
# Multi-Monitor & Misc
# =====================================================
scratchpad_cross_monitor=0
single_scratchpad=1
xwayland_persistence=1

# XWayland + fractional scale. DP-2 runs scale 1.3333333; XWayland surfaces are
# rendered by the compositor at LOGICAL size (2880x1620) and upscaled to the
# panel's 3840x2160, which is the same blur gaming.conf describes for Proton
# and .exe apps. ignore_scale makes XWayland render at NATIVE pixels instead,
# so nothing is stretched -- but the compositor then stops sizing those apps,
# and each one must scale itself via font DPI (docs: "use dpi to scale
# xwayland", 1.5 * 96 = 144). Ours is 1.3333333 * 96 = 128.
#
# Consequence: any XWayland app on DP-2 renders 1:1 and so LOOKS SMALL until it
# is given its own DPI. Per-app, via the Exec line of a .desktop override:
#     env GDK_DPI_SCALE=1.3333333   GTK3/wx  (see BambuStudio.desktop override)
#     env QT_FONT_DPI=128           Qt5/6
# DP-1 and HDMI-A-2 are scale:1, so this changes nothing on them.
#
# Added 2026-09-19 for BambuStudio, which forces GDK_BACKEND=x11 on itself
# because its bundled wxWidgets has no EGL/Wayland support for wxGLCanvas --
# it cannot be made a native Wayland client, so this is the only sharp path.
xwayland_ignore_scale=1
# Explicit sync (drm syncobj). On by default upstream; keeps NVIDIA from
# tearing/stuttering on buffer handoff.
sync_obj_enable=1
circle_layout=dwindle,tile,vertical_tile,monocle,scroller
axis_bind_apply_timeout=100

# =====================================================
# Gaming
# =====================================================
# Sourced LAST so its allow_tearing / window rules win over the blocks above.
# Inert until a game actually runs.
source=~/.config/mango/gaming.conf
