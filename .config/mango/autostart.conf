# -----------------------------------------------------
# Autostart – mirrors ~/.config/hypr/autostart.conf
# -----------------------------------------------------
# No dbus-update-activation-environment line here on purpose: mango exports
# WAYLAND_DISPLAY / XDG_CURRENT_DESKTOP to the systemd+dbus activation
# environment itself, and forcing XDG_CURRENT_DESKTOP=wlroots would send the
# portal looking for wlroots-portals.conf instead of mango-portals.conf.

# --- Core Components ---
exec-once=~/.config/scripts/launch-quickshell.sh &
exec-once=systemctl --user start hyprpolkitagent.service
exec-once=awww-daemon
exec-once=swaync
# hypridle talks ext-idle-notify-v1, which mango implements, but its default
# config shells out to hyprctl — so point it at the mango-specific timers.
exec-once=hypridle -c ~/.config/mango/idle.conf
# The portal occasionally doesn't get d-bus activated; starting it is a no-op
# when it's already up.
exec-once=/usr/lib/xdg-desktop-portal-wlr &

# --- Clipboard ---
exec-once=wl-paste --type text --watch cliphist store
exec-once=wl-paste --type image --watch cliphist store
exec-once=wl-clip-persist --clipboard regular

# --- Apps ---
# SSH agent lives in Bitwarden (see environment.d/ssh-agent.conf) — must be
# running (and unlocked) for git/ssh to see keys.
exec-once=bitwarden-desktop &
exec-once=discord &
exec-once=spotify &
