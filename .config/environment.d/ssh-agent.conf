# Bitwarden desktop is the SSH agent (enable "SSH agent" in its settings).
# Set unconditionally: if Bitwarden isn't running yet, ssh silently falls back
# to ~/.ssh keys; once it starts, the socket is picked up with no re-login.
# Picked up by the systemd user session (uwsm/Hyprland and everything under it).
#
# 2026-07-15: we used to override the socket to $XDG_RUNTIME_DIR via
# BITWARDEN_SSH_AUTH_SOCK, but a Bitwarden update stopped honoring that and
# went back to its default $HOME/.bitwarden-ssh-agent.sock. Use the default
# everywhere instead of overriding — one less thing to break on updates.
SSH_AUTH_SOCK=$HOME/.bitwarden-ssh-agent.sock
