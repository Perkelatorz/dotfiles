# Shader cache size — per the CachyOS gaming guide.
#   https://wiki.cachyos.org/configuration/gaming/  ("Increase maximum shader cache size")
#
# Shaders compile as you play and are cached to disk. The default cache is small
# enough that a large game's shaders exceed it, so old entries are evicted and
# recompiled on the next launch — which is the stutter-on-first-encounter and
# long-load problem, every session rather than once.
#
# Both vendors are set because both machines have both: the desktop is an RTX
# 4080 SUPER alongside a Raphael iGPU, the laptop an RTX 4060 alongside Phoenix1.
# Each variable is read only by its own driver, so setting both is free.
#
# Read by the systemd user session, which is what SDDM starts mango under, so it
# reaches games launched from Steam/Lutris/Heroic. Takes effect next login.

# NVIDIA — bytes (12 GB)
__GL_SHADER_DISK_CACHE_SIZE=12000000000

# Mesa / AMD — accepts a size suffix
MESA_SHADER_CACHE_MAX_SIZE=12G
