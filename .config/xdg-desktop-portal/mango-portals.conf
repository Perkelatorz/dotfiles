# Portal backends for the mango session.
# Selected by XDG_CURRENT_DESKTOP=mango, which mango sets itself at startup.
# The Hyprland session keeps using portals.conf next to this file.

[preferred]
default=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
# xdg-desktop-portal-hyprland speaks Hyprland-only protocols and will not bind
# under mango; -wlr uses wlr-screencopy, which mango implements.
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
# NOTE: no GlobalShortcuts line — xdg-desktop-portal-wlr does not implement
# that interface (only -hyprland and -gnome/-kde do). Apps that register push-
# to-talk or hotkeys through the portal (Discord, OBS) will fall back to their
# own handling. Mango's own `globalkeybinding` window rule covers Wayland apps
# if you need a replacement.
