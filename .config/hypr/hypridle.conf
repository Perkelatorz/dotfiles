general {
    lock_cmd = pidof hyprlock || hyprlock       # avoids starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # turn on display on resume
}

listener {
    timeout = 600                                # 10 minutes
    on-timeout = hyprctl dispatch dpms off       # screen off when timeout has passed
    on-resume = hyprctl dispatch dpms on         # screen on when activity is detected
}

# Wake-only listener. Keeps hypridle in an idle state a few seconds after input
# stops, so the next input always fires an on-resume. Without this, a manual
# `hyprctl dispatch dpms off` (SUPER+SHIFT+S) leaves the screen black until the
# 600s listener above finally times out. on-resume is a no-op when already on.
listener {
    timeout = 5
    on-timeout = true
    on-resume = hyprctl dispatch dpms on
}
