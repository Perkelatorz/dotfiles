# Feral GameMode. Applied when a game runs under `gamemoderun %command%`, or
# when a title calls into libgamemode itself (several do, without being asked).
#
# Read from $XDG_CONFIG_HOME/gamemode.ini, ahead of /etc/gamemode.ini.

[general]
; Nothing here on purpose.
;
; In particular NOT desiredgov=performance. CachyOS's `game-performance`
; wrapper already flips power-profiles-daemon to the performance profile for
; the life of the game, and having two things fight over the CPU governor is
; the same mistake as running gamemode and ananicy-cpp together.
; Pick one; the wrapper is the CachyOS-native path and is what their gaming
; guide tells you to put in launch options.

[cpu]
; --- 7950X3D core pinning -------------------------------------------------
;
; The desktop is a 7950X3D: two CCDs, and only one has the 3D V-Cache.
;     cpus 0-7, 16-23   96 MB L3   <- V-Cache, the gaming CCD
;     cpus 8-15, 24-31  32 MB L3   <- clocks higher
;
; The kernel's amd-pstate prefcore ranks cores by peak performance, and the
; NON-cache CCD wins that comparison (highest_perf 206-236 vs 166-191). So by
; default the scheduler prefers exactly the wrong half for games, which care
; far more about 96 MB of L3 than about ~200 MHz.
;
; pin_cores=yes makes gamemode detect this itself: it reads each core's
; index3/size and pins the game to the cache-rich chiplet. It is not a
; hardcoded core list, so this file stays correct on a machine with a
; different topology — on a uniform-cache CPU it logs "this is not a x3D with
; multiple chiplets" and does nothing, which is why this is shared config and
; not a ##class.desktop alternate.
pin_cores=yes

; Parking OFFLINES the other chiplet rather than just steering away from it.
; Pinning gets almost all of the benefit; parking costs you those cores for
; everything else running (shader compilation, streaming, Discord) and has to
; be undone cleanly on exit. Left off deliberately.
park_cores=no
