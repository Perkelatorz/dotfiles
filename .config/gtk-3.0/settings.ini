# GTK3 settings. Started life as the CachyOS default (cachyos-mango-noctalia's
# /etc/skel copy) and is now tracked, because it does real work and a fresh
# clone was otherwise coming up with none of it.
#
# The THEME here is adw-gtk3, and the colours come from gtk.css, which imports
# the matugen-generated colors.css (untracked -- regenerated per wallpaper by
# select-wallpaper.sh). GTK4 needs no settings.ini: libadwaita reads gtk.css
# directly.
#
# capitaine-cursors is declared in wayland.pkgs so this file never names a
# cursor theme that is not installed.
[Settings]
gtk-theme-name=adw-gtk3
gtk-cursor-theme-name=capitaine-cursors
gtk-cursor-theme-size=24
gtk-toolbar-style=GTK_TOOLBAR_ICONS
gtk-toolbar-icon-size=GTK_ICON_SIZE_LARGE_TOOLBAR
gtk-button-images=0
gtk-menu-images=0
gtk-enable-event-sounds=1
gtk-enable-input-feedback-sounds=0
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
gtk-application-prefer-dark-theme=1
