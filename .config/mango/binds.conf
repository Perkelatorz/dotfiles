# -----------------------------------------------------
# Key Bindings – mirrors ~/.config/hypr/binds.conf
# MangoWC syntax: bind[flags]=MODIFIERS,KEY,DISPATCHER,PARAMETERS
#   flags: l = works while locked, s = keysym match, r = on release, p = pass through
# -----------------------------------------------------
# Deliberate deviations from the Hyprland side are marked "DIFF:".

# =====================================================
# Utility
# =====================================================
# Shortcut cheat sheet
bind=SUPER,slash,spawn,~/.config/scripts/hyprkeys.sh
# Screenshot fullscreen (clipboard)
bind=SUPER,I,spawn,~/.config/scripts/screenshot-fullscreen.sh
# Screenshot region (clipboard)
bind=SUPER+SHIFT,I,spawn,~/.config/scripts/screenshot-region.sh
# App launcher
bind=SUPER,R,spawn,rofi -show drun
# Clipboard history
bind=SUPER,V,spawn,~/.config/scripts/clipboard-rofi.sh --all
# Clipboard images
bind=SUPER+SHIFT,V,spawn,~/.config/scripts/clipboard-rofi.sh --images
# Wallpaper picker
bind=SUPER,W,spawn,~/.config/scripts/select-wallpaper.sh
# Add package
bind=SUPER,Z,spawn,~/.config/scripts/add-package.sh
# DIFF: Hyprland uses `dpms off`; mango's sleep_monitor takes one monitor at a
# time, so the script fans it out across every connected output.

# Screen off (wake with mouse/key)
bind=SUPER+SHIFT,S,spawn,~/.config/scripts/screen-off.sh

# =====================================================
# Applications
# =====================================================
# Terminal
bind=SUPER,Return,spawn,kitty
# File manager
bind=SUPER,E,spawn,thunar
# Browser
bind=SUPER,F,spawn,firefox

# =====================================================
# Gaming
# =====================================================
# Steam Big Picture (couch/controller UI)
bind=SUPER+SHIFT,G,spawn,steam steam://open/bigpicture

# Alt+Tab steps through every window across all monitors/tags. Mango's
# focusstack is stack-local, the same limitation cyclenext had on Hyprland, so
# the shared script drives it over IPC instead.

# Alt-Tab: next window
bind=ALT,Tab,spawn,~/.config/scripts/alt-tab-cycle.sh next
# Alt-Tab: prev window
bind=ALT+SHIFT,Tab,spawn,~/.config/scripts/alt-tab-cycle.sh prev

# =====================================================
# Window Management
# =====================================================
# Close window
bind=SUPER,C,killclient,
# Force close (SIGKILL)
bind=SUPER+SHIFT,C,killclient,force
# Quit mango
bind=SUPER,M,quit,
# Toggle floating
bind=SUPER,T,togglefloating,
# Center window
bind=SUPER,G,centerwin,
# Swap with next in stack
bind=SUPER,X,exchange_stack_client,next
# Pin window to all tags (Hyprland: pin)
bind=SUPER+CTRL,P,toggleglobal,
# Focus last window
bind=SUPER,U,focuslast,
# Maximize (Hyprland: fullscreen,1 — keeps the bar)
bind=SUPER+SHIFT,F,togglemaximizescreen,
# Fullscreen (Hyprland: fullscreen,0)
bind=SUPER+CTRL,F,togglefullscreen,

# DIFF: extra mango-only aliases on space — no Hyprland counterpart.

# Fullscreen (alt)
bind=SUPER,space,togglefullscreen,
# Maximize (alt)
bind=SUPER+SHIFT,space,togglemaximizescreen,

# =====================================================
# Focus Windows
# =====================================================
# Note: J=up / K=down matches the Hyprland side, not vim convention.

# Focus Left
bind=SUPER,H,focusdir,left
# Focus Right
bind=SUPER,L,focusdir,right
# Focus Up
bind=SUPER,J,focusdir,up
# Focus Down
bind=SUPER,K,focusdir,down
# Cycle Next Window
bind=SUPER,Tab,focusstack,next
# Cycle Prev Window
bind=SUPER+SHIFT,Tab,focusstack,prev

# =====================================================
# Move / Swap Windows
# =====================================================
# Move Left
bind=SUPER+SHIFT,H,exchange_client,left
# Move Right
bind=SUPER+SHIFT,L,exchange_client,right
# Move Up
bind=SUPER+SHIFT,J,exchange_client,up
# Move Down
bind=SUPER+SHIFT,K,exchange_client,down

# =====================================================
# Resize Windows
# =====================================================
# Resize Left
bind=SUPER+CTRL,H,resizewin,-20,+0
# Resize Right
bind=SUPER+CTRL,L,resizewin,+20,+0
# Fine Resize Left
bind=SUPER+ALT,H,resizewin,-10,+0
# Fine Resize Right
bind=SUPER+ALT,L,resizewin,+10,+0
# Resize Up (mango-only)
bind=SUPER+CTRL,J,resizewin,+0,-20
# Resize Down (mango-only)
bind=SUPER+CTRL,K,resizewin,+0,+20

# Bracket resize — same feel as Hyprland's Size +/- and Height +/-

# Size +
bind=SUPER,bracketright,resizewin,+80,+0
# Size -
bind=SUPER,bracketleft,resizewin,-80,+0
# Height +
bind=SUPER+SHIFT,bracketright,resizewin,+0,+60
# Height -
bind=SUPER+SHIFT,bracketleft,resizewin,+0,-60

# =====================================================
# Workspaces
# =====================================================
# Mango tags are already per-monitor, so these behave like split-workspace did
# on Hyprland — no plugin needed. Second arg is synctag (0 = this monitor only).

# Workspace 1
bind=SUPER,1,view,1,0
# Workspace 2
bind=SUPER,2,view,2,0
# Workspace 3
bind=SUPER,3,view,3,0
# Workspace 4
bind=SUPER,4,view,4,0
# Workspace 5
bind=SUPER,5,view,5,0

# tagsilent = move without following, matching Hyprland movetoworkspacesilent.

# Move window to Workspace 1
bind=SUPER+SHIFT,1,tagsilent,1
# Move window to Workspace 2
bind=SUPER+SHIFT,2,tagsilent,2
# Move window to Workspace 3
bind=SUPER+SHIFT,3,tagsilent,3
# Move window to Workspace 4
bind=SUPER+SHIFT,4,tagsilent,4
# Move window to Workspace 5
bind=SUPER+SHIFT,5,tagsilent,5

# Brackets are taken by resize above (matching Hyprland), so tag nav sits on Ctrl.

# Next Workspace
bind=SUPER+CTRL,bracketright,viewtoright_have_client,0
# Prev Workspace
bind=SUPER+CTRL,bracketleft,viewtoleft_have_client,0

# Scratchpad (Hyprland: special workspace "magic")
bind=SUPER,S,toggle_scratchpad,

# =====================================================
# Layout
# =====================================================
# Toggle split direction (Hyprland: dwindle togglesplit)
bind=SUPER,semicolon,dwindle_toggle_split_direction,
# Cycle layouts (mango-only)
bind=SUPER+SHIFT,semicolon,switch_layout,
# DIFF: Hyprland binds SUPER,P to dwindle `pseudo`, which mango has no
# equivalent for. Reused for master count instead.

# Add master
bind=SUPER,P,incnmaster,+1
# Remove master
bind=SUPER+SHIFT,P,incnmaster,-1
# Grow master area
bind=SUPER,equal,setmfact,+0.05
# Shrink master area
bind=SUPER,minus,setmfact,-0.05
# Swap with master
bind=SUPER+SHIFT,Return,zoom,

# =====================================================
# Monitors
# =====================================================
# Next Monitor
bind=SUPER,N,focusmon,right
# Prev Monitor
bind=SUPER,B,focusmon,left
# Move window to next Monitor
bind=SUPER+SHIFT,N,tagmon,right
# Move window to prev Monitor
bind=SUPER+SHIFT,B,tagmon,left

# =====================================================
# Overview / Gaps
# =====================================================
# Toggle overview
bind=SUPER,O,toggleoverview,
# Overview with jump labels
bind=SUPER+SHIFT,O,togglejump,
# Increase gaps
bind=SUPER+SHIFT,equal,incgaps,+1
# Decrease gaps
bind=SUPER+SHIFT,minus,incgaps,-1
# Toggle gaps
bind=SUPER+SHIFT,0,togglegaps,

# =====================================================
# Multimedia
# =====================================================
# `l` flag = still fires while the screen is locked (Hyprland bindel/bindl).

# Volume Up
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
# Volume Down
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# Mute Audio
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# Brightness Up
bindl=NONE,XF86MonBrightnessUp,spawn_shell,brightnessctl -e4 -n2 set 5%+ && qs ipc call osd brightness
# Brightness Down
bindl=NONE,XF86MonBrightnessDown,spawn_shell,brightnessctl -e4 -n2 set 5%- && qs ipc call osd brightness

# Media Next
bindl=NONE,XF86AudioNext,spawn,playerctl next
# Media Pause
bindl=NONE,XF86AudioPause,spawn,playerctl play-pause
# Media Play
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
# Media Prev
bindl=NONE,XF86AudioPrev,spawn,playerctl previous

# =====================================================
# Mouse
# =====================================================
# Mouse Move
mousebind=SUPER,btn_left,moveresize,curmove
# Mouse Resize
mousebind=SUPER,btn_right,moveresize,curresize

# Scroll over the desktop to change tags (mango-only)

# Scroll: prev workspace
axisbind=SUPER,UP,viewtoleft_have_client
# Scroll: next workspace
axisbind=SUPER,DOWN,viewtoright_have_client
