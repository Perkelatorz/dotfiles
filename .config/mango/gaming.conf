# -----------------------------------------------------------------------------
# Gaming tuning — sourced LAST from config.conf, mirrors ~/.config/hypr/gaming.conf
#
# Safe to keep sourced on every machine: tearing is inert until a window
# carrying force_tearing actually runs, and the rules only match game windows
# (Steam app IDs, gamescope, Proton .exe). Nothing here affects normal desktop
# use.
#
# Recommended Steam launch options (per game → Properties → Launch Options).
#
# ONE-LINE FIX FOR FULLSCREEN PAIN (cursor escaping, alt-tab minimize, blur) —
# wrap the game in gamescope. It runs the game in its own nested compositor, so
# to mango it's just a normal window that keeps rendering, and the game can't
# grab your other monitors:
#   gamescope -W 3840 -H 2160 -f --force-grab-cursor -- gamemoderun mangohud %command%
#     -W/-H 3840x2160     render at native 4K → sharp (no fractional upscale)
#     -f                  fullscreen the gamescope window (on DP-3, see rule below)
#     --force-grab-cursor confines the mouse to the game so it can't slide onto
#                         DP-2/HDMI-A-2 mid-match; alt-tab no longer minimizes it
#     gamemoderun         CPU governor → performance for the session
#     mangohud            FPS/temp overlay (toggle in-game with Right Shift + F12)
#
# Lighter alternatives (skip gamescope; the window rules below still apply):
#   gamemoderun mangohud %command%              # perf governor + overlay, native window
#   __GL_SYNC_TO_VBLANK=0 mangohud %command%    # let the immediate rule tear (NVIDIA)
# -----------------------------------------------------------------------------

# --- Tearing: lowers input latency in fullscreen games. -----------------------
# 0 = off, 1 = on (per-window, via the force_tearing rule below — this is the
# Hyprland `allow_tearing = true` + `immediate` model), 2 = fullscreen windows
# only. Set to 2 if you'd rather not maintain the appid list.
allow_tearing=1

# --- Per-game window rules ----------------------------------------------------
# Matches: steam_app_<id>  (native + Proton games launched from Steam)
#          gamescope       (the gamescope micro-compositor)
#          *.exe           (Proton/Wine windows launched outside Steam)
# Hyprland matched on `class`; mango's `appid` returns the X11 class for
# XWayland clients, so the same pattern applies to both.

# game-performance: tear, and don't waste GPU on effects for an opaque game.
windowrule=appid:^(steam_app_\d+|gamescope|.*\.exe)$,force_tearing:1,noblur:1,isnoshadow:1,isnoanimation:1,isnosizehint:1,idleinhibit_when_focus:1

# game-monitor: pin games to the gaming panel so they never open on
# DP-2/HDMI-A-2 by accident, and go straight to fullscreen there.
# Change DP-3 to another output (or comment out) to game elsewhere.
windowrule=appid:^(steam_app_\d+|gamescope|.*\.exe)$,monitor:DP-3,isfullscreen:1

# Add launchers/edge-case titles as you meet them, e.g.:
# windowrule=appid:^(heroic|lutris)$,idleinhibit_when_focus:1

# --- Two Hyprland gaming knobs with NO mango equivalent -----------------------
#
# 1. xwayland { force_zero_scaling = true }
#    DP-3 runs at scale 1.33, and XWayland apps (Steam, Proton games, most .exe
#    titles) don't do fractional scaling themselves — the compositor renders
#    them at the logical resolution and upscales, which is the blur. Hyprland
#    could force native pixel density; mango exposes no such option.
#    Workaround: run the affected game under native-res gamescope, which sizes
#    its own surface and hands mango an already-4K buffer:
#      gamescope -W 3840 -H 2160 -f -- %command%
#
# 2. misc { vrr = 0 } is now per-monitor — see vrr:0 in monitors.conf. VRR stays
#    off deliberately: 3 mixed-refresh panels on NVIDIA black-screen/flicker when
#    the surface set changes. For a single-display session, set vrr:1 on DP-3's
#    monitorrule, or add vrr_only_fullscreen:1 to the game rule above.
#
# --- HDR (DP-3 — the 4K240 panel on this desk) -------------------------------
# Not enabled, same as the Hyprland side. On mango, HDR additionally requires
# the wl-only build (mangowm-wlonly-git): it needs the vulkan renderer, and
# scenefx — which the default mangowm package builds against — has none.
# Once on that build:
#   env=WLR_RENDERER,vulkan          (in env.conf, needs a full re-login)
#   hdr_depth=2                      (0 default, 1 HDR8, 2 HDR10)
#   hdr:1 on DP-3's monitorrule in monitors.conf
# Otherwise do HDR per-game and leave the desktop in SDR:
#   gamescope -f --hdr-enabled -- %command%
# Confirm what a panel is actually driving with:  mmsg get monitor DP-3
