# DP-3 — two deliberate deviations from what nwg-displays generated:
#
# 1. 119.88 instead of 239.99. 4K240 needs a 2331.75 MHz pixel clock, which is
#    99.6% of this panel's rated 2340 MHz ceiling and requires DSC over DP. The
#    link does not carry it cleanly here: the result is visible corruption in a
#    screen corner that does NOT appear in a screen recording, because it
#    happens at scanout, after compositing. 119.88 (1186.81 MHz) is rock solid.
#    There is no intermediate 4K mode — the panel offers only 240 and 120 — so
#    this is the whole fallback. Raise it back to 239.99 after fitting a
#    VESA-certified DP40/DP80 cable, which is the usual cure.
#    NB: this line also carried bitdepth,10, which makes 4K240 need *more*
#    bandwidth than mango's 8-bit request, so Hyprland was the worse case.
#    10-bit is kept here since it is comfortable at 120Hz.
#
# 2. scale 1.3333333 instead of 1.33. wp_fractional_scale_v1 sends scale to
#    clients as an integer number of 120ths; 1.33 is 159.6/120, not
#    representable, so clients get 160/120 = 1.333333 while the compositor lays
#    out at 1.33. 1.3333333 rounds to exactly 160/120 AND divides 3840x2160
#    into a whole 2880x1620, so windows stop landing on fractional pixels.
monitor=DP-3,3840x2160@119.88,1440x1440,1.3333333,bitdepth,10
