# -----------------------------------------------------
# hypridle config for mango — mirrors ~/.config/hypr/hypridle.conf
# Loaded via:  hypridle -c ~/.config/mango/idle.conf
# -----------------------------------------------------
# hypridle itself is compositor-agnostic (ext-idle-notify-v1); only the commands
# it runs are Hyprland-specific, so those are swapped for the mmsg-based
# screen-off/screen-on scripts.

general {
    # The shell is the locker now (LockScreen.qml). The IPC call is idempotent
    # — locking an already-locked session is a no-op — so nothing needs the
    # pidof guard hyprlock required to avoid stacking instances.
    lock_cmd = qs ipc call lock lock
    before_sleep_cmd = loginctl lock-session     # lock before suspend
    after_sleep_cmd = ~/.config/scripts/screen-on.sh
}

listener {
    timeout = 600                                 # 10 minutes
    on-timeout = ~/.config/scripts/screen-off.sh
    on-resume = ~/.config/scripts/screen-on.sh
}

# Wake-only listener. Keeps hypridle in an idle state a few seconds after input
# stops, so the next input always fires an on-resume. Without this, a manual
# screen-off (SUPER+SHIFT+S) leaves the panels dark until the 600s listener
# above finally times out. screen-on.sh is a no-op when already on.
listener {
    timeout = 5
    on-timeout = true
    on-resume = ~/.config/scripts/screen-on.sh
}
