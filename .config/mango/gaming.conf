# -----------------------------------------------------------------------------
# Gaming tuning — sourced LAST from config.conf, mirrors ~/.config/hypr/gaming.conf
#
# Safe to keep sourced on every machine: tearing is inert until a window
# carrying force_tearing actually runs, and the rules only match game windows
# (Steam app IDs, gamescope, Proton .exe). Nothing here affects normal desktop
# use.
#
# Recommended Steam launch options (per game → Properties → Launch Options).
#
# ONE-LINE FIX FOR FULLSCREEN PAIN (cursor escaping, alt-tab minimize, blur) —
# wrap the game in gamescope. It runs the game in its own nested compositor, so
# to mango it's just a normal window that keeps rendering, and the game can't
# grab your other monitors:
#   gamescope -W 3840 -H 2160 -f --force-grab-cursor -- gamemoderun mangohud %command%
#     -W/-H 3840x2160     render at native 4K → sharp (no fractional upscale)
#     -f                  fullscreen the gamescope window (on DP-3, see rule below)
#     --force-grab-cursor confines the mouse to the game so it can't slide onto
#                         DP-2/HDMI-A-2 mid-match; alt-tab no longer minimizes it
#     gamemoderun         CPU governor → performance for the session
#     mangohud            FPS/temp overlay (toggle in-game with Right Shift + F12)
#
# Lighter alternatives (skip gamescope; the window rules below still apply):
#   gamemoderun mangohud %command%              # perf governor + overlay, native window
#   __GL_SYNC_TO_VBLANK=0 mangohud %command%    # let the immediate rule tear (NVIDIA)
# -----------------------------------------------------------------------------

# --- Tearing: lowers input latency in fullscreen games. -----------------------
# 0 = off, 1 = on for ANY window, 2 = fullscreen windows only.
#
# Use 2, not 1. `1` is not the Hyprland "global allow + per-window `immediate`"
# model it looks like: check_tearing_frame_allow() (src/ext-protocol/tearing.h)
# falls back to the client's OWN tearing hint for any window that has no
# force_tearing rule —
#     if (config.allow_tearing == TEARING_ENABLED)
#         if (c->force_tearing == STATE_UNSPECIFIED) return c->tearing_hint;
# — and Chromium/Electron apps set that hint. On a 240Hz panel that means
# visible tearing on ordinary windowed apps (Claude desktop, Firefox) whenever
# their contents change, e.g. on focus switches.
#
# With 2, non-fullscreen windows return false unconditionally, while the games
# below still tear: they are fullscreen AND carry force_tearing:1.
allow_tearing=2

# --- Per-game window rules ----------------------------------------------------
# Matches: steam_app_<id>  (native + Proton games launched from Steam)
#          gamescope       (the gamescope micro-compositor)
#          *.exe           (Proton/Wine windows launched outside Steam)
# Hyprland matched on `class`; mango's `appid` returns the X11 class for
# XWayland clients, so the same pattern applies to both.

# game-performance: tear, and don't waste GPU on effects for an opaque game.
windowrule=appid:^(steam_app_\d+|gamescope|.*\.exe)$,force_tearing:1,noblur:1,isnoshadow:1,isnoanimation:1,isnosizehint:1,idleinhibit_when_focus:1

# game-monitor: the rule that pins games to a specific panel lives in
# monitors.conf, NOT here.
#
# This file is shared by every machine, but connector names are per-machine:
# the DP-3 pin that is right on the desktop names an output that does not exist
# on a laptop, and a rule pinning windows to a missing monitor is a silent trap.
# monitors.conf is already a ##class alternate, so the pin belongs there with
# the rest of the output-specific config.

# Add launchers/edge-case titles as you meet them, e.g.:
# windowrule=appid:^(heroic|lutris)$,idleinhibit_when_focus:1

# --- Two Hyprland gaming knobs with NO mango equivalent -----------------------
#
# 1. xwayland { force_zero_scaling = true }
#    DP-3 runs at scale 1.33, and XWayland apps (Steam, Proton games, most .exe
#    titles) don't do fractional scaling themselves — the compositor renders
#    them at the logical resolution and upscales, which is the blur. Hyprland
#    could force native pixel density; mango exposes no such option.
#    Workaround: run the affected game under native-res gamescope, which sizes
#    its own surface and hands mango an already-4K buffer:
#      gamescope -W 3840 -H 2160 -f -- %command%
#
# 2. VRR is per-monitor. It is ON for DP-2 only (the 4K240 gaming panel) and the
#    game windowrule carries vrr_only_fullscreen:1, so it engages for fullscreen
#    games and nowhere else. Blanket VRR was off because three mixed-refresh
#    panels on NVIDIA black-screen/flicker whenever the surface set changes;
#    confining it to one panel in fullscreen keeps it out of that path.
#    If a QD-OLED shows brightness shift on static scenes, set DP-2 back to
#    vrr:0 — the windowrule stays valid and simply stops engaging.
#
# --- HDR --------------------------------------------------------------------
# Desktop stays SDR. HDR is done PER GAME through gamescope:
#
#     gamescope -f --hdr-enabled -- %command%
#
# gamescope 3.16.25 is installed and does the whole job: --hdr-enabled,
# --hdr-sdr-content-nits (default 400), and --hdr-itm-enabled for SDR->HDR
# inverse tone mapping. It composites HDR itself and hands the compositor a
# finished frame, so mango never needs to understand HDR content.
#
# Why NOT switch mango to the wl-only build for desktop-wide HDR, which an
# earlier version of this file suggested:
#
#   1. It has no XWayland. mangowm-wlonly-git's depends list omits
#      xorg-xwayland entirely — that is what "wl-only" means. Steam is an
#      XWayland client and so are most Proton titles, so the machine would lose
#      the ability to run the games this is all for.
#   2. It is nine minor versions behind: 0.7.1 against the 0.16.x we run.
#
# The installed mango could not do desktop HDR anyway. It has the output-side
# knobs (hdr_depth, hdr_force, hdr_max_lum, hdr_min_lum, hdr_max_avg_lum) but
# advertises no color-management protocol — wp_color_manager_v1,
# xx_color_manager_v4 and wp_image_description_v1 are all absent from the
# binary, though wlroots itself has the support. Without that protocol a client
# cannot tell the compositor it is producing HDR, so forcing the output into
# HDR10 would just show SDR content on an HDR signal: washed out, not brighter.
#
# Confirm what a panel is actually driving with:  mmsg get all-monitors
